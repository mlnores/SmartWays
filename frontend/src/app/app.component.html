<header class="app-header">
  <div class="brand-cluster">
    <a class="brand" routerLink="/routes">SmartWays</a>
    @if (instruction$ | async; as instruction) {
      @if (instruction) {
        <span class="page-instruction">{{ instruction }}</span>
      }
    }
  </div>
  <nav aria-label="Main navigation">
    <a routerLink="/routes" routerLinkActive="active">Routes</a>
    <a routerLink="/itineraries" routerLinkActive="active">Itineraries</a>
    <a routerLink="/pois" routerLinkActive="active">POIs</a>
  </nav>
</header>

<main class="app-main">
  <router-outlet></router-outlet>
</main>
