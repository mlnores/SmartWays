<dialog class="route-dialog" id="routeDialog">
  <div class="route-dialog-header">
    <h2>Itinerary Summary</h2>
    <button id="closeRouteDialog" aria-label="Close itinerary summary" (click)="closeRouteDialog.emit()">✖</button>
  </div>
  <div class="route-dialog-body" id="routeDialogBody"></div>
  <div class="route-dialog-footer">
    <button id="closeRouteDialogFooter" (click)="closeRouteDialog.emit()">Close</button>
  </div>
</dialog>

<dialog class="route-dialog poi-detail-dialog" id="poiDetailDialog">
  <div class="route-dialog-header">
    <h2 id="poiDetailTitle">POI</h2>
    <button id="closePoiDetailDialog" aria-label="Close POI details" (click)="closePoiDetailDialog.emit()">✖</button>
  </div>
  <div class="route-dialog-body poi-detail-body" id="poiDetailBody" (click)="poiDetailBodyClick.emit($event)"></div>
  <div class="route-dialog-footer">
    <button id="addPoiFromDetail" type="button" class="primary" (click)="addPoiFromDetail.emit()">Add POI</button>
    <button id="closePoiDetailDialogFooter" type="button" (click)="closePoiDetailDialog.emit()">Close</button>
  </div>
</dialog>
