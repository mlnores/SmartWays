<main class="app" #editorRoot>
  <app-itinerary-editor-sidebar
    (tabSelected)="activateTab($event)"
    (searchInput)="handleSearchInput($event)"
    (searchKeydown)="handleSearchKeydown($event.type, $event.event)"
    (poiSearchRefresh)="refreshPoiSearchResults()"
    (searchResultsClick)="handleSearchResultsClick($event.type, $event.event)"
    (pointListKeydown)="handlePointListKeydown($event)"
    (pointListClick)="handlePointListClick($event)"
    (pointListInput)="handlePointListInput($event)"
    (pointListChange)="handlePointListChange($event)"
    (pointListFocusout)="handlePointListFocusout($event)"
    (pointListPointerdown)="handlePointListPointerdown($event)"
    (pointListPointerup)="handlePointListPointerup()"
    (pointListDragstart)="handlePointListDragstart($event)"
    (pointListDragover)="handlePointListDragover($event)"
    (pointListDragleave)="handlePointListDragleave($event)"
    (pointListDrop)="handlePointListDrop($event)"
    (pointListDragend)="handlePointListDragend()"
    (clearAll)="clearAll()"
    (fitRoute)="fitRoute()"
    (showRouteSummary)="showRouteSummary()"
  ></app-itinerary-editor-sidebar>

  <app-itinerary-editor-map
    #mapComponent
    (mapCanvasClick)="handleMapCanvasClick($event)"
    (togglePoiBrowser)="togglePoiBrowser()"
    (poiBrowserFiltersChange)="handlePoiBrowserFiltersChange($event)"
    (poiBrowserListClick)="handlePoiBrowserListClick($event)"
    (poiBrowserListMouseover)="handlePoiBrowserListMouseover($event)"
    (poiBrowserListMouseout)="handlePoiBrowserListMouseout($event)"
    (poiBrowserListFocusin)="handlePoiBrowserListFocusin($event)"
    (poiBrowserListFocusout)="handlePoiBrowserListFocusout($event)"
  ></app-itinerary-editor-map>

  <div class="map-action-overlay" aria-label="Itinerary state actions">
    <button id="revertItinerary" type="button" title="Revert to last saved itinerary" (click)="revertItinerary()">Revert</button>
    <button id="saveItinerary" type="button" class="primary" title="Save current itinerary" (click)="saveItinerary()">Save</button>
    <button id="undoItinerary" type="button" aria-label="Undo last itinerary change" title="Undo last itinerary change (Cmd/Ctrl+Z)" (click)="undoItinerary()">↶</button>
    <button id="redoItinerary" type="button" aria-label="Redo last undone itinerary change" title="Redo last undone itinerary change (Cmd/Ctrl+Shift+Z or Cmd/Ctrl+Y)" (click)="redoItinerary()">↷</button>
  </div>

  @if (saveFeedback) {
    <div class="save-toast" [class.error]="saveFeedback.type === 'error'" [class.success]="saveFeedback.type === 'success'" role="status" aria-live="polite">
      {{ saveFeedback.message }}
    </div>
  }
</main>

<app-itinerary-editor-dialogs
  (closeRouteDialog)="closeRouteDialog()"
  (closePoiDetailDialog)="closePoiDetailDialog()"
  (poiDetailBodyClick)="handlePoiDetailBodyClick($event)"
  (addPoiFromDetail)="addPoiFromDetail()"
></app-itinerary-editor-dialogs>
