services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: smartways
      POSTGRES_USER: smartways
      POSTGRES_PASSWORD: smartways
    ports:
      - "5432:5432"
    volumes:
      - smartways_postgres_data:/var/lib/postgresql/data

volumes:
  smartways_postgres_data:
